name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build universal binary
        run: make universal

      - name: Bundle and zip
        run: make zip BIN=.build/universal/Hyperlayer VERSION="${GITHUB_REF_NAME#v}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Hyperlayer.zip --title "Hyperlayer $GITHUB_REF_NAME" --generate-notes
